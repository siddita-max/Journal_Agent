server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index journal_module.html;

    # Docker DNS resolver for runtime service discovery.
    resolver 127.0.0.11 ipv6=off valid=30s;

    location / {
        try_files $uri $uri/ /journal_module.html;
    }

    # Proxy API so the frontend can call /api/... without CORS.
    location /api/ {
        set $api_upstream  http://api:8000;
        proxy_pass         $api_upstream$request_uri;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
    }
}
